name: Build RK3399 MID Linux (kernel + initramfs + boot.img)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "内核版本（kernel.org v6.x 目录下的版本号，例如 6.12）"
        required: false
        default: "6.12"
      fragment:
        description: "内核配置片段"
        required: false
        default: "linux/config.m1.fragment"
  push:
    paths:
      - "linux/**"
      - "tools/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler cpio xz-utils curl ca-certificates file \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1

      # ---------- 先做快的：busybox + initramfs ----------
      - name: Fetch static busybox (Alpine, arm64/musl)
        run: |
          set -euo pipefail
          DIR=https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/
          APK=$(curl -sSL "$DIR" | grep -oE 'busybox-static-[0-9.]+-r[0-9]+\.apk' | head -1)
          echo "APK=$APK"
          [ -n "$APK" ] || { echo "找不到 busybox-static"; exit 1; }
          curl -sSL -o bb.apk "$DIR$APK"
          rm -rf bbroot && mkdir -p bbroot
          tar -xzf bb.apk -C bbroot 2>/dev/null || tar -xf bb.apk -C bbroot
          find bbroot -type f | head -20
          BB=$(find bbroot -type f -name 'busybox*' | head -1)
          echo "BB=$BB"
          cp "$BB" busybox.arm64
          chmod +x busybox.arm64
          file busybox.arm64
          ./busybox.arm64 2>/dev/null | head -2 || true

      - name: Assemble initramfs
        run: |
          set -euo pipefail
          rm -rf irfs && mkdir -p irfs/bin irfs/proc irfs/sys irfs/dev irfs/tmp irfs/etc
          cp busybox.arm64 irfs/bin/busybox
          cp linux/initramfs/init irfs/init
          cp linux/initramfs/udhcpc.script irfs/bin/udhcpc.script
          chmod +x irfs/init irfs/bin/udhcpc.script
          ( cd irfs && find . | cpio -o -H newc --owner=0:0 --reproducible 2>/dev/null | gzip -9 ) > initramfs.cpio.gz
          ls -l initramfs.cpio.gz

      # ---------- 内核 ----------
      - name: Fetch kernel
        run: |
          set -euo pipefail
          KREF="${{ github.event.inputs.kernel_ref || '6.12' }}"
          curl -sSL --retry 3 -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KREF}.tar.xz"
          ls -l linux.tar.xz
          tar xf linux.tar.xz
          mv "linux-${KREF}" ksrc

      - name: Apply board DTS
        run: |
          set -euo pipefail
          D=ksrc/arch/arm64/boot/dts/rockchip
          cp linux/rk3399-mid.dts "$D/rk3399-mid.dts"
          echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-mid.dtb' >> "$D/Makefile"

      - name: Configure
        run: |
          set -euo pipefail
          FRAG="${{ github.event.inputs.fragment || 'linux/config.m1.fragment' }}"
          echo "使用配置片段: $FRAG"
          cd ksrc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/$FRAG"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E "CONFIG_DWMAC_ROCKCHIP|CONFIG_MMC_SDHCI_OF_ARASAN|CONFIG_SERIAL_8250_DW|CONFIG_DRM=|CONFIG_SOUND=" .config

      - name: Build kernel + dtbs
        run: |
          set -euo pipefail
          cd ksrc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image dtbs 2>&1 | tail -30
          IZ=$(stat -c%s arch/arm64/boot/Image)
          DZ=$(stat -c%s arch/arm64/boot/dts/rockchip/rk3399-mid.dtb)
          echo "Image = $IZ B ($((IZ/1048576)) MiB)"
          echo "DTB   = $DZ B"
          echo "boot 分区 = 32 MiB -> 预算 30 MiB"
          awk -v iz="$IZ" 'BEGIN{ if (iz > 30*1048576) print "::warning::Image 超预算，需要继续瘦身" }'

      - name: Pack boot.img
        run: |
          set -euo pipefail
          mkdir -p out
          python3 tools/mkbootimg.py \
            --kernel ksrc/arch/arm64/boot/Image \
            --ramdisk initramfs.cpio.gz \
            --name rk3399-mid \
            --cmdline "console=ttyS2,1500000n8 earlycon=uart8250,mmio32,0xff1a0000 root=/dev/ram0 rw init=/init loglevel=7 coherent_pool=2M" \
            -o out/boot.img
          cp ksrc/arch/arm64/boot/Image out/Image
          cp ksrc/arch/arm64/boot/dts/rockchip/rk3399-mid.dtb out/rk3399-mid.dtb
          cp initramfs.cpio.gz out/initramfs.cpio.gz
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: rk3399-mid-linux
          path: out/*
          if-no-files-found: error

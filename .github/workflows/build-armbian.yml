name: Build Armbian image (RK3399-MID)

# 在 GitHub Actions 上用官方 armbian/build 源码编译 RK3399-MID 的完整 Armbian 镜像。
# 官方编译容器镜像：ghcr.io/armbian/docker-armbian-build:armbian-ubuntu-noble-latest
# 板级配置来源：本仓库 armbian/userpatches/（免 fork armbian/build）

on:
  workflow_dispatch:
    inputs:
      release:
        description: "用户空间发行版"
        required: false
        default: "noble"
        type: choice
        options: [noble, trixie, bookworm]
      desktop:
        description: "是否构建桌面版（默认 minimal CLI）"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "armbian/**"
      - "tools/mk-parm-variant.py"
      - ".github/workflows/build-armbian.yml"
    branches: [main]

concurrency:
  group: armbian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Armbian rk3399-mid (${{ inputs.release || 'noble' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------- 1. 取源码 ----------
      - name: Checkout this repo (customisations)
        uses: actions/checkout@v4
        with:
          path: custom
          fetch-depth: 1

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: build
          fetch-depth: 1

      - name: Checkout Armbian os (userspace / packages)
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          path: os
          fetch-depth: 1

      # ---------- 2. 拼 userpatches ----------
      - name: Prepare userpatches
        run: |
          set -euo pipefail
          mkdir -pv build/userpatches
          if [ -d os/userpatches ]; then
            rsync -a os/userpatches/ build/userpatches/
          fi
          rsync -a custom/armbian/userpatches/ build/userpatches/
          echo "=== userpatches 清单 ==="
          find build/userpatches -type f | sort
          echo
          echo "=== 板级配置（前 40 行） ==="
          head -40 build/userpatches/config/boards/rk3399-mid.csc

      # ---------- 3. 主机依赖 ----------
      - name: Install build requirements
        run: |
          set -euo pipefail
          cd build
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .

      # ---------- 4. 编译 ----------
      - name: Build Armbian image
        run: |
          set -euo pipefail
          cd build
          ./compile.sh build \
            BOARD=rk3399-mid \
            BRANCH=current \
            RELEASE="${{ inputs.release || 'noble' }}" \
            BUILD_DESKTOP="${{ inputs.desktop && 'yes' || 'no' }}" \
            BUILD_MINIMAL="${{ inputs.desktop && 'no' || 'yes' }}" \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=img \
            SHARE_LOG=yes \
            EXPERT=yes

      # ---------- 5. 产物自检 ----------
      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd build
          echo "=== output/images ==="
          ls -la output/images/ || true
          echo
          echo "=== armbian u-boot deb ==="
          ls -la output/debs/*u-boot* 2>/dev/null || true

          # armbian 把 uboot.img / trust.bin 打进 linux-u-boot-<board>-<branch>.deb，
          # 解出来才能看魔数、也才能作为单独产物留存。
          mkdir -p ubootpkg
          for DEB in output/debs/linux-u-boot-rk3399-mid-*.deb; do
            [ -e "$DEB" ] || continue
            echo "--- 解包 $DEB"
            dpkg-deb -x "$DEB" ubootpkg
          done

          echo
          echo "=== 引导件 ==="
          find ubootpkg -type f \( -name 'uboot.img' -o -name 'trust.bin' -o -name 'idbloader.bin' \) \
            -exec ls -la {} \; || true

          for f in $(find ubootpkg -type f \( -name 'uboot.img' -o -name 'trust.bin' \) | sort); do
            echo "--- $f  (头 32B)"
            xxd -l 32 "$f"
          done

          IMG=$(ls output/images/*.img 2>/dev/null | head -1 || true)
          if [ -n "$IMG" ]; then
            echo "=== $IMG 关键扇区魔数 ==="
            python3 - "$IMG" <<'PY'
          import sys, os
          p = sys.argv[1]
          f = open(p, "rb")

          def peek(lba, n=32):
              f.seek(lba*512)
              return f.read(n)

          checks = [
              (0,     "PARM / MBR 区"),
              (1,     "GPT 头区"),
              (64,    "idbloader 区（本板不写）"),
              (8192,  "LOADER (uboot.img)"),
              (16384, "BL3X  (trust.bin)"),
              (24576, "trust 备用区"),
              (32768, "p1 起点"),
          ]
          for lba, name in checks:
              d = peek(lba)
              txt = "".join(chr(b) if 32 <= b < 127 else "." for b in d)
              print(f"  LBA {lba:>6}  {name:<24} {d[:8].hex(' ')}  {txt[:8]}")
          print(f"  image size = {os.path.getsize(p)/1048576:.1f} MiB")
          PY
          fi

      # ---------- 6. 生成「保留原厂 PARM」变体 ----------
      # 本板 boot0 miniloader 靠 user 区 LBA0 的 Rockchip parameter 里的 mtdparts
      # 定位 uboot@0x2000 / trust@0x4000；而 GPT 会同时占用 LBA0(MBR) 与 LBA1(GPT 头)。
      # 变体把 parameter 压到 446 B、MBR 分区表放 446..511、并抹掉 GPT 头/表。
      # 这一步失败不应阻断主产物上传，所以不用 set -e。
      - name: Build PARM-preserving variant
        run: |
          set -uo pipefail
          IMG=$(ls -1 build/output/images/*.img 2>/dev/null | head -1 || true)
          if [ -z "$IMG" ]; then
            echo "::warning::没有找到 .img，跳过 PARM 变体"
            exit 0
          fi
          OUT="${IMG%.img}-parm.img"
          echo "输入: $IMG"
          echo "输出: $OUT"
          if ! python3 custom/tools/mk-parm-variant.py "$IMG" "$OUT"; then
            echo "::warning::mk-parm-variant.py 失败（主产物不受影响）"
            exit 0
          fi
          echo "=== 变体校验 ==="
          python3 - "$OUT" <<'PY'
          import struct, sys, os
          S = 512
          f = open(sys.argv[1], "rb")
          l0 = f.read(S)
          print("  LBA0 magic    :", l0[:4])
          size = struct.unpack_from("<I", l0, 4)[0]
          print("  PARM 长度     :", size, "字节（必须 <= 446）")
          for i in range(4):
              e = l0[446+i*16:462+i*16]
              if e == b"\x00"*16:
                  continue
              first, cnt = struct.unpack_from("<II", e, 8)
              print(f"  MBR slot{i+1}    : type=0x{e[4]:02x} first={first} count={cnt} last={first+cnt-1}")
          print("  MBR 签名      :", l0[510:512].hex())
          f.seek(S)
          print("  LBA1 (GPT 头) :", f.read(8))
          print("  镜像大小      : %.1f MiB" % (os.path.getsize(sys.argv[1])/1048576))
          PY

      # ---------- 7. 收集产物 ----------
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find build/output/images -maxdepth 1 -type f -exec cp -a {} out/ \; || true
          find build/output/debs -maxdepth 2 -type f -name '*.deb' -exec cp -a {} out/ \; || true
          # 引导件单独取出来：刷机要按 LBA 坐标分件写，不能整盘覆盖
          for f in $(find build/ubootpkg -type f \( -name 'uboot.img' -o -name 'trust.bin' -o -name 'idbloader.bin' \) 2>/dev/null); do
            cp -a "$f" "out/boot-$(basename "$f")"
          done
          # 确认本板 DTB 真的被注入并编译出来了
          for f in $(find build -path '*boot/dts/rockchip/rk3399-mid.dtb' 2>/dev/null | head -3); do
            cp -a "$f" out/ 2>/dev/null || true
          done
          echo "=== out/ ==="
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3399-mid-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
